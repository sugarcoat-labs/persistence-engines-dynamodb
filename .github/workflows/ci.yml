# ==============================================================================
# GitHub Actions CI Specification — persistence-engines-dynamodb
# ==============================================================================
# What this workflow does (in plain English):
#
# 1. Triggers automatically on every push or pull request targeting `main`.
# 2. Spins up a clean Ubuntu Linux runner on GitHub that already has Docker
#    pre-installed and running.
# 3. Downloads two repositories side-by-side into the workspace:
#      - `core/`     -> sugarcoat-labs/persistence-engines-core (contracts & TCK)
#      - `dynamodb/` -> this repository (Amazon DynamoDB realization)
# 4. Installs Java 24 (Eclipse Temurin) and caches Maven dependencies across runs.
# 5. Builds and installs `persistence-engines-core` into the runner's local
#    Maven cache (`~/.m2`) so both the core JPMS module and the portable TCK
#    `test-jar` are available to the DynamoDB build.
# 6. Compiles `persistence-engines-dynamodb`, starts an ephemeral
#    `amazon/dynamodb-local` container via Testcontainers, executes all
#    inherited TCK integration tests (`*IT.java`) against real DynamoDB wire
#    semantics, and generates full Javadocs (`mvn -B verify javadoc:javadoc`).
# ==============================================================================

name: Java 24 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout persistence-engines-core
        uses: actions/checkout@v5
        with:
          repository: sugarcoat-labs/persistence-engines-core
          path: core

      - name: Checkout persistence-engines-dynamodb
        uses: actions/checkout@v5
        with:
          path: dynamodb

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: |
            core/pom.xml
            dynamodb/pom.xml

      - name: Install persistence-engines-core (including TCK test-jar)
        working-directory: core
        run: mvn -B install -DskipTests

      - name: Build, run DynamoDB TCK integration tests, and generate Javadoc
        working-directory: dynamodb
        run: mvn -B verify javadoc:javadoc
